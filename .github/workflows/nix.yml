name: Nix Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest]
    uses: manic-systems/workflows/.github/workflows/nix-checks.yml@4d2d4a73ac933d23f00fb7a17dd39569f8e1c1dc # v2.3.2
    with:
      os: ${{ matrix.os }}
